<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Spelling Elevator Dictation</title>
<style>
:root{
  --bg:#ececea;--line:#c8c8c3;--ink:#232423;--muted:#6d6e6a;
  --good:#29935d;--bad:#ce4b4b;--warn:#e0a52e;--danger:#c73d3d;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)
}
button,input{font:inherit}
.app{
  height:100vh;height:100dvh;
  display:grid;
  grid-template-rows:auto 6px minmax(0,1fr) auto;
  background:linear-gradient(#fbfbfa 0 17%,#e8e8e5 17% 100%);
}
.top{
  background:#fafafa;padding:calc(env(safe-area-inset-top) + 6px) 10px 8px;
  border-bottom:1px solid #d4d4cf
}
.top-row{
  display:grid;grid-template-columns:44px minmax(0,1fr) 44px;
  gap:8px;align-items:center
}
.circle{
  width:42px;height:42px;border-radius:50%;border:2px solid var(--line);
  background:#fff;display:grid;place-items:center;font-size:20px;padding:0
}
.title{
  border:2px solid var(--line);border-radius:24px;background:#fff;text-align:center;
  font-weight:900;font-size:clamp(22px,6.5vw,42px);padding:5px 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.meta{
  display:flex;justify-content:center;gap:12px;flex-wrap:wrap;
  margin-top:5px;color:var(--muted);font-size:13px
}
.timer-track{background:#d9d9d5;overflow:hidden}
.timer-bar{height:100%;width:100%;background:var(--good);transform-origin:left center}
.timer-bar.warning{background:var(--warn)}
.timer-bar.danger{background:var(--danger)}

.main{
  min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:7px 10px
}
.status{min-height:58px;text-align:center;display:grid;place-items:center}
.status-main{font-size:clamp(18px,5vw,27px);font-weight:900}
.status-sub{margin-top:2px;color:var(--muted);font-size:13px}

.elevator-zone{min-height:0;display:grid;place-items:center}
.elevator{
  width:min(84vw,470px);height:min(44vh,480px);min-height:250px;
  display:grid;grid-template-rows:26px minmax(0,1fr);gap:7px
}
.display{
  width:170px;height:26px;margin:auto;border-radius:14px;background:#3f403d;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;
  font-size:12px;letter-spacing:.08em
}
.frame{
  position:relative;border:11px solid #92938f;background:#555653;
  overflow:hidden;box-shadow:inset 0 0 0 3px #dededb
}
.inside{
  position:absolute;inset:0;background:linear-gradient(#4a4b48,#222321);
  color:#fff;display:grid;place-items:center;text-align:center;padding:18px
}
.inside-title{font-size:clamp(28px,8vw,48px);font-weight:900}
.countdown{font-size:clamp(66px,21vw,138px);font-weight:900;line-height:1}
.inside-sub{font-size:14px;color:#dededb;margin-top:6px}
.panel{position:absolute;top:0;bottom:0;width:50%;z-index:3;transition:transform .48s cubic-bezier(.2,.8,.2,1)}
.left{left:0;background:linear-gradient(90deg,#ddddda,#c5c6c2 70%,#aaa);border-right:1px solid #767773}
.right{right:0;background:linear-gradient(90deg,#aaa,#c5c6c2 30%,#ddddda);border-left:1px solid #eee}
.frame.open .left{transform:translateX(-98%)}
.frame.open .right{transform:translateX(98%)}
.frame.good{outline:6px solid var(--good)}
.frame.bad{outline:6px solid var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.input-box{
  margin:7px auto 0;width:min(96%,680px);background:#fff;border:2px solid var(--line);
  border-radius:18px;padding:8px 10px;text-align:center
}
.slots{
  min-height:48px;display:flex;justify-content:center;align-items:flex-end;
  gap:7px;flex-wrap:wrap;padding:4px 2px 2px
}
.slot{
  width:clamp(24px,7vw,38px);height:42px;border-bottom:4px solid #9a9b97;
  display:grid;place-items:center;font-size:clamp(24px,7vw,38px);
  font-weight:900;line-height:1;text-transform:uppercase
}
.slot.filled{border-bottom-color:#2f302e}
.slot.wrong{color:var(--bad);border-bottom-color:var(--bad)}
.voice-input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.input-box{cursor:text}
.input-guide{color:var(--muted);font-size:12px;margin-top:5px}

.bottom{
  display:grid;grid-template-columns:1fr 1fr;gap:7px;
  padding:7px 9px calc(env(safe-area-inset-bottom) + 8px);
  background:#f8f8f7;border-top:1px solid #d3d3cf
}
.btn{
  min-height:46px;border:0;border-radius:13px;padding:9px 10px;
  background:#494a47;color:#fff;font-weight:900;font-size:15px
}
.btn.alt{background:#8f908c}
.btn:disabled{opacity:.45}

.overlay{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(20,20,20,.7);padding:18px;z-index:20
}
.overlay.show{display:flex}
.modal{
  width:min(90vw,470px);background:#fff;border-radius:22px;padding:23px 18px;text-align:center
}
.modal h2{margin:0 0 7px;font-size:31px}
.modal .big{font-size:clamp(36px,10vw,62px);font-weight:900;margin:9px 0;word-break:break-word}
.modal p{color:var(--muted)}
.modal .btn{width:100%;margin-top:8px}
@media(max-height:690px){
  .status{min-height:46px}.status-main{font-size:18px}
  .elevator{height:min(39vh,390px);min-height:220px}
  .bottom{padding-top:5px}.btn{min-height:42px}
}

.stage-menu{
position:fixed;inset:0;z-index:100;
display:none;align-items:center;justify-content:center;
background:rgba(20,20,20,.72);padding:18px;
}
.stage-menu.show{display:flex}
.stage-card{
width:min(92vw,520px);background:#fff;border-radius:24px;
padding:20px 16px;text-align:center;
}
.stage-card h2{margin:0 0 14px;font-size:30px}
.stage-select{
display:grid;grid-template-columns:1fr 1fr;
gap:9px;padding:0;background:transparent;
}
.stage-btn{
border:0;border-radius:14px;padding:15px 6px;
font-weight:900;background:#444;color:#fff;
}
.stage-btn small{font-size:11px;font-weight:600;opacity:.78}
.menu-options{
display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;
}
.menu-options label{text-align:left;font-size:12px;color:#666}
.menu-options select{
width:100%;margin-top:4px;border:1px solid #ccc;
border-radius:10px;padding:9px;background:#fff;
}

</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="top-row">
    <button class="circle" id="menuBtn" type="button">☰</button>
    <div class="title">SPELLING ELEVATOR 200</div>
    <button class="circle" id="sound" type="button">🔊</button>
  </div>
  <div class="meta">
    <span id="stageNo">Stage 1</span><span id="wordNo">Word 1 / 50</span>
    <span id="score">Score 0</span>
    <span id="timeText">8.0 sec</span>
  </div>
</header>

<div class="timer-track"><div class="timer-bar" id="timerBar"></div></div>


<div class="stage-menu show" id="stageMenu">
  <div class="stage-card">
    <h2>Choose Stage</h2>
    <div class="stage-select">
      <button class="stage-btn" data-stage="1">Stage 1<br><small>Words 1–50</small></button>
      <button class="stage-btn" data-stage="2">Stage 2<br><small>Words 51–100</small></button>
      <button class="stage-btn" data-stage="3">Stage 3<br><small>Words 101–150</small></button>
      <button class="stage-btn" data-stage="4">Stage 4<br><small>Words 151–200</small></button>
    </div>
    <div class="menu-options">
      <label>Time
        <select id="timeMode">
          <option value="10">Easy · 10 sec</option>
          <option value="8" selected>Normal · 8 sec</option>
          <option value="6">Hard · 6 sec</option>
          <option value="4">Lightning · 4 sec</option>
        </select>
      </label>
      <label>Order
        <select id="orderMode">
          <option value="ordered">In order</option>
          <option value="random">Random</option>
        </select>
      </label>
    </div>
  </div>
</div>

<main class="main">
  <section class="status">
    <div>
      <div class="status-main" id="statusMain">Tap START</div>
      <div class="status-sub" id="statusSub">Listen, then type the spelling before time runs out.</div>
    </div>
  </section>

  <section class="elevator-zone">
    <div class="elevator">
      <div class="display"><span id="displayText">READY</span></div>
      <div class="frame" id="frame">
        <div class="inside">
          <div>
            <div class="inside-title" id="insideTitle">LISTEN</div>
            <div class="countdown" id="countdown"></div>
            <div class="inside-sub" id="insideSub">Use keyboard dictation to type the spelling.</div>
          </div>
        </div>
        <div class="panel left"></div>
        <div class="panel right"></div>
      </div>
    </div>
  </section>

  <section class="input-box" id="inputBox">
    <div class="slots" id="slots" aria-label="Spelling slots"></div>
    <input
      id="spellingInput"
      class="voice-input"
      type="text"
      inputmode="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="characters"
      spellcheck="false"
      aria-label="Spelling answer"
    >
    <div class="input-guide">Type the spelling. The next word plays automatically.</div>
  </section>
</main>

<footer class="bottom">
  <button class="btn" id="startBtn" type="button">START</button>
  <button class="btn alt" id="replayBtn" type="button" disabled>REPLAY</button>
</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Correct!</h2>
    <div class="big" id="modalWord">ACTIVITY</div>
    <p id="modalText">Next word is ready.</p>
    <button class="btn" id="nextBtn" type="button">NEXT WORD</button>
  </div>
</div>

<script>
const WORDS=["ACTIVITY","ALONE","AMAZED","ANCIENT","APPEAR","ARMY","ASLEEP","ASSIGNMENT","ASTRONAUT","ATTACH","AUTHOR","AVOID","BEHAVE","BELIEVE","BELONG","BIOLOGIST","BLANKET","BRAIN","BREATH","BRIDGE","BROTH","CAFETERIA","CAPITAL","CASTLE","CELEBRATE","CHEAP","CHOICE","CHOPSTICKS","CLIFF","COLLECT","COLORFUL","COMFORTABLE","COMMON","COMMUNICATE","COMPLAIN","COMPLETE","CONCEPT","CONDITION","CONFIRM","CONVENIENT","COTTAGE","CRATER","CREDIT","CRITICAL","CROW","CULTURE","CURTAIN","DAMAGE","DANGEROUS","DEFEND","DELICIOUS","DELIVER","DETAIL","DIRECTION","DISCOVER","DISTANCE","DOUGH","DRUMMER","DUMPLING","DUSTY","EARTH","EFFECT","ELECTRICITY","EMBARRASSED","ENEMY","ENGINEER","EXAMPLE","EXERCISE","EXPENSIVE","EXPLORE","EXPRESS","EXTRA","EXTREME","FACTORY","FAIR","FEELING","FEWER","FICTION","FORGIVE","FRIDGE","FRIENDLY","FRIENDSHIP","FURNITURE","GUEST","GUIDE","HAPPEN","HARMFUL","HEALTHY","HERD","HUMAN","HUMPBACK","IMPERFECT","IMPOSSIBLE","INGREDIENT","INSPIRE","INSTEAD","INTERESTED","INVENTION","ISLAND","JEWELRY","JOURNAL","JOURNEY","LANDFILL","LEGEND","LOCATION","MAGAZINE","MEAL","MEERKAT","MESSAGE","MICROSCOPE","MINUTE","MOOD","MURAL","MUSCLE","NATIVE","NECESSARY","NERVOUS","NOTICE","OBSERVE","OPINION","OPPOSITE","OWNER","PAINTBRUSH","PAINTER","PATIENT","PEACEFUL","PERIOD","PLANET","PLASTIC","POLITE","POPULAR","PORCH","POWERFUL","PRICE","PRIDE","PROJECT","PROMISE","PROTECT","PROUD","PURPOSE","PURR","PYRAMID","QUOTATION","REACH","REACT","REALIZE","REASON","RECIPE","REGRET","RELAX","REMEMBER","REPLY","REUSE","RHYME","RUMBLE","SCIENTIST","SCREAM","SECRET","SEEM","SEPARATE","SHOCKED","SIGNAL","SIMILAR","SITUATION","SLITHER","SOCIETY","SPACESHIP","SPACESUIT","SPEND","SPICE","STATUE","STEAMER","STRATEGY","STREAM","STRIPE","STYLE","SUPPORT","SURPRISE","SWEATSHIRT","SWEATY","TECHNOLOGY","TELESCOPE","TERRIBLE","TOGETHER","TOUR","TRAILBLAZER","TREASURE","TUNNEL","TURBINE","UNDERGROUND","UNWRAP","USEFUL","VALLEY","VEHICLE","VILLAGE","VOICE","VOLCANO","WHILE","WONDERFUL","YAWN"];

let wordIndex=0, score=0, soundOn=true, round=false, timeLeft=timeLimit, timerId=null;
const $=id=>document.getElementById(id);
const current=()=>WORDS[wordIndex];

function speakWord(){
  if(!soundOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(current().toLowerCase());
  u.lang="en-US";u.rate=.72;u.pitch=1;
  speechSynthesis.speak(u);
}

function normalize(value){
  return value.toUpperCase().replace(/[^A-Z]/g,"");
}

function getStage(){
  return Math.floor(wordIndex/50)+1;
}
function stageStart(){
  return (getStage()-1)*50;
}
function stageEnd(){
  return getStage()*50;
}
function updateHeader(){
  const stage=getStage();
  const within=wordIndex-stageStart()+1;
  $("stageNo").textContent=`Stage ${stage}`;
  $("wordNo").textContent=`Word ${within} / 50`;
  $("score").textContent=`Score ${score}`;
}

function updateTimer(){
  const ratio=Math.max(0,timeLeft/timeLimit);
  $("timerBar").style.width=(ratio*100)+"%";
  $("timeText").textContent=Math.max(0,timeLeft).toFixed(1)+" sec";
  $("countdown").textContent=round?Math.ceil(Math.max(0,timeLeft)):"";
  $("timerBar").classList.toggle("warning",ratio<=.5 && ratio>.25);
  $("timerBar").classList.toggle("danger",ratio<=.25);
}


function renderSlots(){
  const clean=normalize($("spellingInput").value);
  const target=current();
  const slots=$("slots");
  slots.innerHTML="";
  for(let i=0;i<target.length;i++){
    const span=document.createElement("span");
    span.className="slot";
    if(clean[i]){
      span.textContent=clean[i];
      span.classList.add("filled");
      if(clean[i]!==target[i]) span.classList.add("wrong");
    }
    slots.appendChild(span);
  }
}

function focusVoiceInput(){
  const input=$("spellingInput");
  input.focus();
  setTimeout(()=>input.focus(),50);
}


let audioCtx=null;

function ensureAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC) audioCtx=new AC();
  }
  if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
}

function tone(freq,duration=0.1,type="sine",volume=0.16){
  ensureAudio();
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type=type;
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(volume,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+duration);
}

function tickSound(seconds){
  if(seconds<=3 && seconds>0){
    tone(seconds===1?880:660,0.13,"square",0.12);
  }else if(seconds>3){
    tone(420,0.055,"square",0.07);
  }
}

function correctSound(){
  tone(660,0.1,"sine",0.12);
  setTimeout(()=>tone(880,0.14,"sine",0.14),110);
}

function wrongSound(){
  tone(210,0.18,"sawtooth",0.1);
}

function startRound(){
  ensureAudio();
  if(round) return;
  round=true;
  clearInterval(timerId);
  timeLeft=timeLimit;
  updateTimer();

  const input=$("spellingInput");
  input.value="";
  renderSlots();
  focusVoiceInput();

  $("frame").classList.remove("good","bad");
  $("frame").classList.add("open");
  $("displayText").textContent="LISTEN";
  $("insideTitle").textContent="LISTEN";
  $("insideSub").textContent="Type the spelling now.";
  $("statusMain").textContent="LISTEN!";
  $("statusSub").textContent="The keyboard is open. Type the spelling.";
  $("startBtn").disabled=true;
  $("replayBtn").disabled=false;

  setTimeout(()=>{
    speakWord();
    $("displayText").textContent="DICTATE";
    $("insideTitle").textContent="SPELL!";
    $("statusMain").textContent="SPELL NOW!";
    $("statusSub").textContent="Type each letter quickly.";
    let lastSecond=Math.ceil(timeLeft);
  timerId=setInterval(()=>{
      timeLeft-=0.1;
      const nowSecond=Math.ceil(Math.max(0,timeLeft));
      if(nowSecond!==lastSecond){
        lastSecond=nowSecond;
        tickSound(nowSecond);
      }
      updateTimer();
      if(timeLeft<=0) finish(false);
    },100);
  },450);
}

function finish(correct){
  if(!round) return;
  round=false;
  clearInterval(timerId);
  $("frame").classList.add(correct?"good":"bad");
  $("displayText").textContent=correct?"GOOD":"MISS";
  $("statusMain").textContent=correct?"CORRECT!":"TRY AGAIN";
  $("statusSub").textContent=correct?"Great spelling.":"Tap START and type the spelling again.";
  setTimeout(()=>$("frame").classList.remove("open"),350);

  if(correct){
    correctSound();
    score+=100;
    



let chosenStage=1;
let timeLimit=8;
let chosenOrder="ordered";

function shuffleStage(){
  if(chosenOrder!=="random") return;
  const start=(chosenStage-1)*50;
  const end=start+50;
  const section=WORDS.slice(start,end);
  for(let i=section.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [section[i],section[j]]=[section[j],section[i]];
  }
  WORDS.splice(start,50,...section);
}

function chooseStage(stage){
  chosenStage=stage;
  wordIndex=(stage-1)*50;
  score=0;
  level=1;
  timeLimit=Number(document.getElementById("timeMode").value);
  chosenOrder=document.getElementById("orderMode").value;
  shuffleStage();
  document.getElementById("stageMenu").classList.remove("show");
  if(document.getElementById("spellingInput")) document.getElementById("spellingInput").value="";
  if(typeof renderSlots==="function") renderSlots();
  if(typeof updateHeader==="function") updateHeader();
  if(typeof updateTimer==="function"){
    timeLeft=timeLimit;
    updateTimer();
  }
  if(document.getElementById("statusMain")){
    document.getElementById("statusMain").textContent=`Stage ${stage} Ready!`;
    document.getElementById("statusSub").textContent="Press START to begin.";
  }
}

document.querySelectorAll(".stage-btn").forEach(btn=>{
  btn.addEventListener("click",()=>chooseStage(Number(btn.dataset.stage)));
});
document.getElementById("menuBtn").addEventListener("click",()=>{
  document.getElementById("stageMenu").classList.add("show");
});

updateHeader();
    setTimeout(()=>{
      const oldStage=getStage();
      wordIndex++;
      if(wordIndex>=WORDS.length){
        wordIndex=0;
        score=0;
      }
      const newStage=getStage();
      $("frame").classList.remove("good","bad");
      $("spellingInput").value="";
      renderSlots();
      $("displayText").textContent="READY";
      $("startBtn").disabled=true;
      $("replayBtn").disabled=true;
      timeLeft=timeLimit;
      updateHeader();
      updateTimer();

      if(newStage!==oldStage){
        $("statusMain").textContent=`STAGE ${oldStage} CLEAR!`;
        $("statusSub").textContent=`Stage ${newStage} starts now: Words ${stageStart()+1}-${stageEnd()}.`;
        setTimeout(()=>{
          $("startBtn").disabled=false;
          startRound();
        },1400);
      }else{
        $("statusMain").textContent="NEXT WORD!";
        $("statusSub").textContent="Listen carefully.";
        setTimeout(()=>{
          $("startBtn").disabled=false;
          startRound();
        },650);
      }
    },650);
  }else{
    wrongSound();
    $("startBtn").disabled=false;
  }
}

$("spellingInput").addEventListener("input",e=>{
  if(!round) return;
  const clean=normalize(e.target.value);
  const spaced=clean.split("").join(" ");
  if(e.target.value!==spaced) e.target.value=spaced;
  renderSlots();

  if(clean.length>=current().length){
    finish(clean===current());
  }
});

$("spellingInput").addEventListener("keydown",e=>{
  if(e.key==="Enter" && round){
    finish(normalize(e.target.value)===current());
  }
});

$("inputBox").addEventListener("click",focusVoiceInput);
$("startBtn").addEventListener("click",startRound);
$("replayBtn").addEventListener("click",speakWord);
$("sound").addEventListener("click",()=>{
  soundOn=!soundOn;
  $("sound").textContent=soundOn?"🔊":"🔇";
});
$("restart").addEventListener("click",()=>{
  clearInterval(timerId);
  round=false;wordIndex=0;score=0;timeLeft=timeLimit;
  $("frame").classList.remove("open","good","bad");
  $("displayText").textContent="READY";
  $("statusMain").textContent="Tap START";
  $("statusSub").textContent="Listen, then type the spelling before time runs out.";
  $("spellingInput").value="";
  renderSlots();
  $("startBtn").disabled=false;
  $("replayBtn").disabled=true;
  updateHeader();updateTimer();
});
$("nextBtn").addEventListener("click",()=>{
  $("overlay").classList.remove("show");
  wordIndex++;
  if(wordIndex>=WORDS.length){wordIndex=0;score=0}
  $("frame").classList.remove("good","bad");
  $("spellingInput").value="";
  renderSlots();
  $("statusMain").textContent="Tap START";
  $("statusSub").textContent="Then type the spelling.";
  $("displayText").textContent="READY";
  $("startBtn").disabled=false;
  $("replayBtn").disabled=true;
  timeLeft=timeLimit;
  updateHeader();updateTimer();
});

updateHeader();
updateTimer();
renderSlots();
</script>
</body>
</html>
