<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Spelling Elevator</title>
<style>
:root{
  --bg:#ececea;
  --panel:#ffffff;
  --line:#c9c9c4;
  --ink:#242524;
  --muted:#6f706c;
  --metal1:#d9d9d6;
  --metal2:#b7b8b4;
  --metal3:#979894;
  --good:#2f9b64;
  --bad:#d05656;
  --mic:#b53e3e;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
}
button{font:inherit}
.app{
  height:100vh;height:100dvh;
  display:grid;
  grid-template-rows:auto 5px minmax(0,1fr) auto;
  background:linear-gradient(#fafafa 0 18%,#e7e7e4 18% 100%);
}
.top{
  background:#fafafa;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 10px;
  border-bottom:1px solid #d4d4cf;
}
.top-row{
  display:grid;
  grid-template-columns:48px minmax(0,1fr) 48px;
  gap:9px;
  align-items:center;
}
.circle{
  width:46px;height:46px;border-radius:50%;
  border:2px solid var(--line);
  background:#fff;
  display:grid;place-items:center;
  font-size:22px;padding:0;
}
.title{
  border:2px solid var(--line);
  border-radius:25px;
  background:white;
  text-align:center;
  font-weight:900;
  font-size:clamp(28px,8vw,50px);
  padding:6px 8px;
}
.meta{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  margin-top:7px;
  color:var(--muted);
  font-size:14px;
}
.progress{background:#ddd}
.progress>div{height:100%;width:0;background:#b79447;transition:width .25s}

.main{
  min-height:0;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  padding:10px 12px 8px;
}
.message{
  min-height:76px;
  display:grid;
  place-items:center;
  text-align:center;
}
.message strong{font-size:20px}
.message small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:14px;
}
.elevator-area{
  min-height:0;
  display:grid;
  place-items:center;
}
.elevator{
  width:min(86vw,520px);
  height:min(56vh,620px);
  min-height:340px;
  display:grid;
  grid-template-rows:22px minmax(0,1fr);
  gap:8px;
}
.floor-display{
  width:120px;height:22px;
  margin:auto;
  border-radius:12px;
  background:#3f403d;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:800;
  letter-spacing:.08em;
  font-size:12px;
}
.door-frame{
  position:relative;
  border:12px solid #92938f;
  background:#555653;
  overflow:hidden;
  box-shadow:inset 0 0 0 3px #dcdcd8;
}
.inside{
  position:absolute;inset:0;
  display:grid;
  place-items:center;
  background:linear-gradient(#4a4b48,#242523);
  color:#fff;
  text-align:center;
  padding:20px;
}
.inside .listen{
  font-size:clamp(26px,7vw,46px);
  font-weight:900;
  letter-spacing:.03em;
}
.inside .sub{
  margin-top:8px;
  color:#dededb;
  font-size:15px;
}
.panel{
  position:absolute;
  top:0;bottom:0;
  width:50%;
  z-index:3;
  transition:transform .55s ease;
}
.panel.left{
  left:0;
  background:linear-gradient(90deg,var(--metal1),#c8c8c5 64%,var(--metal2));
  border-right:1px solid #767773;
}
.panel.right{
  right:0;
  background:linear-gradient(90deg,var(--metal2),#c8c8c5 36%,var(--metal1));
  border-left:1px solid #e7e7e4;
}
.door-frame.open .left{transform:translateX(-98%)}
.door-frame.open .right{transform:translateX(98%)}
.door-frame.good{outline:6px solid var(--good)}
.door-frame.bad{outline:6px solid var(--bad);animation:shake .3s}
.door-frame.listening{outline:6px solid var(--mic)}
@keyframes shake{
  25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}
}

.transcript{
  margin:10px auto 0;
  width:min(94%,680px);
  min-height:66px;
  background:#fff;
  border:2px solid var(--line);
  border-radius:20px;
  display:grid;
  place-items:center;
  text-align:center;
  padding:10px 12px;
}
.transcript .heard{
  font-size:18px;
  font-weight:800;
}
.transcript .guide{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}
.bottom{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  padding:8px 10px calc(env(safe-area-inset-bottom) + 9px);
  background:#f8f8f7;
  border-top:1px solid #d3d3cf;
}
.btn{
  border:0;
  border-radius:14px;
  padding:11px 15px;
  background:#494a47;
  color:#fff;
  font-weight:800;
}
.btn.alt{background:#979893}
.btn.mic{background:#a43d3d}
.btn:disabled{opacity:.45}

.overlay{
  position:fixed;inset:0;
  display:none;align-items:center;justify-content:center;
  background:rgba(20,20,20,.68);
  padding:20px;
  z-index:99;
}
.overlay.show{display:flex}
.modal{
  width:min(90vw,500px);
  background:#fff;
  border-radius:24px;
  padding:25px 20px;
  text-align:center;
}
.modal h2{margin:0 0 8px;font-size:33px}
.modal .big{
  font-size:clamp(38px,11vw,68px);
  font-weight:900;
  word-break:break-word;
  margin:10px 0;
}
.modal p{color:#6d6e6a;font-size:17px}

@media(max-height:700px){
  .message{min-height:58px}
  .elevator{height:min(50vh,500px);min-height:280px}
  .transcript{min-height:55px}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="top-row">
    <button class="circle" id="restart" type="button">↶</button>
    <div class="title">SPELLING ELEVATOR</div>
    <button class="circle" id="sound" type="button">🔊</button>
  </div>
  <div class="meta">
    <span id="wordLabel">Word 1 / 50</span>
    <span id="scoreLabel">Score 0</span>
  </div>
</header>

<div class="progress"><div id="bar"></div></div>

<main class="main">
  <div class="message">
    <div>
      <strong id="messageMain">Tap “Allow Microphone” first</strong>
      <small id="messageSub">The elevator will open and play one word.</small>
    </div>
  </div>

  <div class="elevator-area">
    <div class="elevator">
      <div class="floor-display" id="floorDisplay">READY</div>
      <div class="door-frame" id="doorFrame">
        <div class="inside">
          <div>
            <div class="listen" id="insideMain">LISTEN</div>
            <div class="sub" id="insideSub">Spell the word before the doors close.</div>
          </div>
        </div>
        <div class="panel left"></div>
        <div class="panel right"></div>
      </div>
    </div>
  </div>

  <div class="transcript">
    <div>
      <div class="heard" id="heardText">Your spelling will appear here.</div>
      <div class="guide" id="guideText">Say letters clearly, one by one: A - C - T - I - V - I - T - Y</div>
    </div>
  </div>
</main>

<footer class="bottom">
  <button class="btn mic" id="allowMic" type="button">Allow Microphone</button>
  <button class="btn" id="startRound" type="button" disabled>Open Door</button>
  <button class="btn alt" id="repeatWord" type="button" disabled>Repeat Word</button>
</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Correct!</h2>
    <div class="big" id="modalWord">ACTIVITY</div>
    <p id="modalText">Great spelling!</p>
    <button class="btn" id="nextWord" type="button">Next Word</button>
  </div>
</div>

<script>
const WORDS=[
"ACTIVITY","ALONE","AMAZED","ANCIENT","APPEAR","ARMY","ASLEEP","ASSIGNMENT","ASTRONAUT","ATTACH",
"AUTHOR","AVOID","BEHAVE","BELIEVE","BELONG","BIOLOGIST","BLANKET","BRAIN","BREATH","BRIDGE",
"BROTH","CAFETERIA","CAPITAL","CASTLE","CELEBRATE","CHEAP","CHOICE","CHOPSTICKS","CLIFF","COLLECT",
"COLORFUL","COMFORTABLE","COMMON","COMMUNICATE","COMPLAIN","COMPLETE","CONCEPT","CONDITION","CONFIRM","CONVENIENT",
"COTTAGE","CRATER","CREDIT","CRITICAL","CROW","CULTURE","CURTAIN","DAMAGE","DANGEROUS","DEFEND"
];

let wordIndex=0;
let score=0;
let soundOn=true;
let micReady=false;
let recognition=null;
let mediaStream=null;
let listening=false;
let roundTimer=null;
let finalTranscript="";

const $=id=>document.getElementById(id);
const currentWord=()=>WORDS[wordIndex];

function speakWord(){
  if(!soundOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(currentWord().toLowerCase());
  u.lang="en-US";
  u.rate=.72;
  u.pitch=1;
  speechSynthesis.speak(u);
}

function normalizeSpelling(text){
  const replacements = {
    "AY":"A","A":"A","BEE":"B","BE":"B","B":"B","SEE":"C","SEA":"C","C":"C",
    "DEE":"D","D":"D","E":"E","EF":"F","F":"F","GEE":"G","G":"G",
    "AITCH":"H","H":"H","EYE":"I","I":"I","JAY":"J","J":"J","KAY":"K","K":"K",
    "EL":"L","L":"L","EM":"M","M":"M","EN":"N","N":"N","OH":"O","O":"O",
    "PEE":"P","P":"P","CUE":"Q","QUEUE":"Q","Q":"Q","ARE":"R","R":"R",
    "ESS":"S","S":"S","TEE":"T","TEA":"T","T":"T","YOU":"U","U":"U",
    "VEE":"V","V":"V","DOUBLEYOU":"W","DOUBLEU":"W","W":"W","EX":"X","X":"X",
    "WHY":"Y","Y":"Y","ZEE":"Z","ZED":"Z","Z":"Z"
  };

  const cleaned=text
    .toUpperCase()
    .replace(/[^A-Z\s-]/g," ")
    .replace(/-/g," ")
    .replace(/\s+/g," ")
    .trim();

  if(!cleaned) return "";

  const parts=cleaned.split(" ");
  let output="";
  for(let i=0;i<parts.length;i++){
    const one=parts[i];
    const two=(parts[i]+(parts[i+1]||"")).replace(/\s/g,"");
    if(two==="DOUBLEYOU" || two==="DOUBLEU"){
      output+="W"; i++; continue;
    }
    if(replacements[one]) output+=replacements[one];
    else if(one.length===1 && /[A-Z]/.test(one)) output+=one;
    else{
      for(const ch of one){
        if(/[A-Z]/.test(ch)) output+=ch;
      }
    }
  }
  return output;
}

function setupRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    $("messageMain").textContent="Speech recognition is not supported here";
    $("messageSub").textContent="Open this page in Chrome on Android or a supported browser.";
    return false;
  }
  recognition=new SR();
  recognition.lang="en-US";
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.maxAlternatives=5;

  recognition.onresult=e=>{
    let combined="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      combined += " " + e.results[i][0].transcript;
    }
    finalTranscript += " " + combined;
    const normalized=normalizeSpelling(finalTranscript);
    $("heardText").textContent=normalized || combined.trim() || "Listening...";
    $("guideText").textContent=`Target length: ${currentWord().length} letters`;

    if(normalized.length>=currentWord().length){
      finishRound(normalized===currentWord(), normalized);
    }
  };

  recognition.onerror=e=>{
    if(listening){
      $("heardText").textContent="I couldn't hear clearly. Try again.";
      finishRound(false,"");
    }
  };

  recognition.onend=()=>{
    if(listening){
      const normalized=normalizeSpelling(finalTranscript);
      finishRound(normalized===currentWord(),normalized);
    }
  };
  return true;
}

async function allowMicrophone(){
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
    micReady=setupRecognition();
    if(micReady){
      $("allowMic").textContent="Microphone On";
      $("allowMic").disabled=true;
      $("startRound").disabled=false;
      $("messageMain").textContent="Ready";
      $("messageSub").textContent="Open the door and listen to the word.";
      $("floorDisplay").textContent="READY";
    }
  }catch(e){
    $("messageMain").textContent="Microphone permission was blocked";
    $("messageSub").textContent="Allow microphone access in your browser settings.";
  }
}

function startRound(){
  if(!micReady || listening) return;

  clearTimeout(roundTimer);
  finalTranscript="";
  listening=true;

  $("heardText").textContent="Listening...";
  $("guideText").textContent="Spell the word aloud, one letter at a time.";
  $("doorFrame").classList.remove("good","bad");
  $("doorFrame").classList.add("open");
  $("floorDisplay").textContent="LISTEN";
  $("insideMain").textContent="LISTEN";
  $("insideSub").textContent="Now spell the word aloud.";
  $("messageMain").textContent="Listen carefully";
  $("messageSub").textContent="The word will play once. You say only the spelling.";
  $("startRound").disabled=true;
  $("repeatWord").disabled=false;

  setTimeout(()=>{
    speakWord();
    setTimeout(()=>{
      $("doorFrame").classList.add("listening");
      $("floorDisplay").textContent="SPEAK";
      $("messageMain").textContent="Spell it now";
      $("messageSub").textContent="Say each letter before the doors close.";
      try{ recognition.start(); }catch(e){}
    },900);
  },550);

  roundTimer=setTimeout(()=>{
    if(listening){
      try{recognition.stop()}catch(e){}
      const normalized=normalizeSpelling(finalTranscript);
      finishRound(normalized===currentWord(),normalized);
    }
  },9000);
}

function finishRound(correct, normalized){
  if(!listening) return;
  listening=false;
  clearTimeout(roundTimer);

  try{recognition.stop()}catch(e){}

  $("doorFrame").classList.remove("listening");
  $("doorFrame").classList.add(correct?"good":"bad");

  setTimeout(()=>{
    $("doorFrame").classList.remove("open");
  },450);

  if(correct){
    score+=100;
    $("heardText").textContent=normalized;
    $("guideText").textContent="Correct spelling!";
    $("messageMain").textContent="Correct!";
    $("messageSub").textContent="The doors are closing.";
    $("floorDisplay").textContent="GOOD";
    updateHeader();

    setTimeout(()=>{
      $("modalTitle").textContent="Correct!";
      $("modalWord").textContent=currentWord();
      $("modalText").textContent="You spelled it correctly.";
      $("overlay").classList.add("show");
    },850);
  }else{
    $("heardText").textContent=normalized || "No spelling detected";
    $("guideText").textContent=`Try again. ${currentWord().length} letters.`;
    $("messageMain").textContent="Try again";
    $("messageSub").textContent="Listen to the same word one more time.";
    $("floorDisplay").textContent="AGAIN";
    $("startRound").disabled=false;
    $("repeatWord").disabled=false;
  }
}

function updateHeader(){
  $("wordLabel").textContent=`Word ${wordIndex+1} / ${WORDS.length}`;
  $("scoreLabel").textContent=`Score ${score}`;
  $("bar").style.width=`${(wordIndex/WORDS.length)*100}%`;
}

$("allowMic").addEventListener("click",allowMicrophone);
$("startRound").addEventListener("click",startRound);
$("repeatWord").addEventListener("click",speakWord);
$("sound").addEventListener("click",()=>{
  soundOn=!soundOn;
  $("sound").textContent=soundOn?"🔊":"🔇";
});
$("restart").addEventListener("click",()=>{
  wordIndex=0;score=0;
  $("doorFrame").classList.remove("open","good","bad","listening");
  $("heardText").textContent="Your spelling will appear here.";
  $("guideText").textContent="Say letters clearly, one by one.";
  $("messageMain").textContent=micReady?"Ready":"Tap “Allow Microphone” first";
  $("messageSub").textContent="The elevator will open and play one word.";
  $("startRound").disabled=!micReady;
  updateHeader();
});
$("nextWord").addEventListener("click",()=>{
  $("overlay").classList.remove("show");
  wordIndex++;
  if(wordIndex>=WORDS.length){
    wordIndex=0;
    score=0;
  }
  $("doorFrame").classList.remove("good","bad");
  $("heardText").textContent="Your spelling will appear here.";
  $("guideText").textContent="Say letters clearly, one by one.";
  $("messageMain").textContent="Ready";
  $("messageSub").textContent="Open the door and listen to the next word.";
  $("floorDisplay").textContent="READY";
  $("startRound").disabled=false;
  $("repeatWord").disabled=true;
  updateHeader();
});

updateHeader();
</script>
</body>
</html>
